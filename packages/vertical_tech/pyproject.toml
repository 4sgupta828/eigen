[project]
name = "eigen-vertical-tech"
version = "0.0.0"
description = "Eigen deep-tech research vertical (SEC/EDGAR + arXiv + open scholarly/code/news; VC-diligence)"
requires-python = ">=3.13"
dependencies = ["eigen-kernel"]

[project.entry-points."eigen.verticals"]
tech = "eigen_vertical_tech:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` bundles everything under the package dir INCLUDING data/*.json fixtures —
# do NOT add a force-include for data/ (double-adds files, fails a clean wheel build).
packages = ["eigen_vertical_tech"]
