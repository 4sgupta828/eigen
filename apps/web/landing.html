<!-- ═══════════════════════════════════════════════════════════════════════════════════════════
     REUSABLE PRODUCT LANDING TEMPLATE
     ───────────────────────────────────────────────────────────────────────────────────────────
     Split the way the codebase is split: MECHANICS below carry no product vocabulary, and every
     product-specific word lives in the SITE object in the block marked CONFIG. Copy this file and
     replace SITE to stand it up for a different product.

     DESIGN NOTE — the page has exactly one memorable element: the LEDGER in the hero, which sets
     what a company has ANNOUNCED beside what it has PROVEN and names what is still unestablished.
     That split is the product's whole thesis, so it gets the screen and everything else stays
     quiet. Deliberately avoided: a feature-card grid, oversized step numerals, tick-circle lists,
     an all-caps label above every heading, and an arrow glued to every button.
     ═══════════════════════════════════════════════════════════════════════════════════════════ -->

<script>
/* Theme is shared with the platform shell under the same "eigen-theme" key, with the same three
   values and the SAME default (editorial for a first-time visitor). Applied here in <head> so the
   page paints in the right theme instead of flashing light first. Keep this in sync with the
   equivalent block in index.html — a reader moving between / and /app must not see it change. */
/* The homepage always uses the EDITORIAL (warm parchment) theme so it matches the /w product shell,
   which is editorial-only. No light/dark switching here. */
document.documentElement.setAttribute("data-theme", "editorial");
</script>

<style>
  /* EDITORIAL (warm parchment) — the SAME palette + fonts as the /w product shell, so the homepage
     and the product look like one product. This is the base and the only theme the homepage uses. */
  :root, :root[data-theme="editorial"]{
    color-scheme:light;
    --bg:#F6F3EA; --paper:#FDFBF5; --sunk:#F0ECE0; --ink:#221D12; --muted:#6E6550;
    --accent:#8A6A1F; --accent-deep:#6E5314; --accent-rgb:138,106,31;
    --proven:#2E6B4F; --proven-bg:#E4EDE4;
    --claimed:#A05C24; --claimed-bg:#F3E7D6;
    --rule:#DCD4C0; --rule-soft:rgba(34,29,18,.06);
    --display:"Source Serif 4",Charter,Georgia,serif;
    --ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;font-size:15px;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
    font-size:1rem;line-height:1.58;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:60rem;margin:0 auto;padding-inline:1.2rem;}
  a{color:var(--accent-deep);text-underline-offset:3px;}

  h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.014em;
    line-height:1.14;margin:0 0 .85rem;}
  h1{font-size:clamp(2.15rem,4.4vw,3.05rem);line-height:1.06;letter-spacing:-.02em;text-wrap:balance;}
  h2{font-size:clamp(1.6rem,3.4vw,2.25rem);}
  h3{font-size:1.02rem;font-weight:600;margin:0 0 .3rem;font-family:var(--ui);}
  p{margin:0 0 .9rem;}
  .lede{font-size:clamp(1.05rem,1.9vw,1.18rem);color:var(--muted);max-width:33rem;}
  .note{color:var(--muted);max-width:34rem;font-size:.96rem;}
  section{padding-block:clamp(2.8rem,5.5vw,4.4rem);}
  section + section{border-top:1px solid var(--rule);}

  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);}
  .topin{max-width:60rem;margin:0 auto;padding:.45rem 1.2rem;display:flex;align-items:center;gap:1.4rem;}
  .logo{height:50px;width:auto;flex:none;}
  .nav{display:flex;gap:1.3rem;margin-left:.4rem;}
  .nav a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:500;
    display:inline-flex;align-items:center;min-height:40px;}
  .nav a:hover{color:var(--ink);}
  .topcta{margin-left:auto;opacity:0;transform:translateY(-4px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;}
  .topcta.on{opacity:1;transform:none;pointer-events:auto;}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
    padding:.55rem 1.15rem;border-radius:7px;background:var(--accent);color:#fff;
    text-decoration:none;font-weight:600;font-size:.94rem;border:1px solid var(--accent-deep);
    transition:background .15s ease;}
  :root[data-theme="dark"] .btn:not(.quiet){color:#17100A;}
  :root[data-theme="editorial"] .btn:not(.quiet){color:#FDF8EA;}
  .btn:hover{background:var(--accent-deep);}
  .btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule);}
  .btn.quiet:hover{background:var(--sunk);border-color:var(--accent);}

  .hero{padding-block:clamp(2.6rem,6vw,4.4rem) clamp(2.4rem,5vw,3.6rem);}
  .heroGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
    gap:clamp(1.6rem,4vw,3rem);align-items:start;}
  .heroActs{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:1.4rem;}

  .ledger{background:var(--paper);border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 14px 34px -22px rgba(15,27,38,.45);overflow:hidden;}
  .ledgerTabs{display:flex;border-bottom:1px solid var(--rule);background:var(--sunk);
    overflow-x:auto;scrollbar-width:none;}
  .ledgerTabs::-webkit-scrollbar{display:none}
  .ltab{flex:1 0 auto;min-height:44px;padding:.55rem .9rem;border:0;background:transparent;
    cursor:pointer;font-family:var(--ui);font-size:.8rem;font-weight:500;color:var(--muted);
    border-bottom:2px solid transparent;white-space:nowrap;}
  .ltab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--paper);}
  .ledgerQ{padding:.95rem 1.05rem .8rem;font-family:var(--display);font-size:1.1rem;
    line-height:1.3;border-bottom:1px solid var(--rule);}
  .cols{display:grid;grid-template-columns:1fr 1fr;}
  .col{padding:.85rem 1.05rem 1rem;}
  .col + .col{border-left:1px solid var(--rule);}
  .colHead{display:flex;align-items:baseline;gap:.45rem;margin-bottom:.7rem;
    font-size:.82rem;font-weight:600;flex-wrap:wrap;}
  .col.claimed .colHead{color:var(--claimed);}
  .col.proven  .colHead{color:var(--proven);}
  .colHead em{font-style:normal;font-weight:400;color:var(--muted);font-size:.74rem;}
  .row{padding:.5rem 0;border-top:1px solid var(--rule-soft);font-size:.89rem;line-height:1.45;}
  .row:first-of-type{border-top:0;}
  .cite{display:inline-block;margin-top:.28rem;font-family:var(--mono);font-size:.66rem;
    border-radius:4px;padding:.06rem .32rem;}
  .col.proven .cite{color:var(--proven);background:var(--proven-bg);}
  .col.claimed .cite{color:var(--claimed);background:var(--claimed-bg);}
  .ledgerGap{padding:.7rem 1.05rem;border-top:1px solid var(--rule);background:var(--sunk);
    font-size:.85rem;color:var(--muted);}
  .ledgerGap b{color:var(--ink);font-weight:600;}

  .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4rem 1.6rem;}
  .strip div{font-size:.95rem;}
  .strip b{display:block;font-weight:600;}
  .strip span{color:var(--muted);font-size:.88rem;}

  .flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;
    border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper);}
  .fcell{padding:1.05rem 1.1rem;}
  .fcell + .fcell{border-left:1px solid var(--rule);}
  .fcell p{margin:0;color:var(--muted);font-size:.9rem;}

  .srcTable{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper);}
  .srcRow{display:grid;grid-template-columns:minmax(9rem,.8fr) minmax(0,2fr);gap:1rem;
    padding:.7rem 1.05rem;border-top:1px solid var(--rule);align-items:baseline;}
  .srcRow:first-child{border-top:0;}
  .srcRow.sig{background:var(--claimed-bg);}
  .srcName{font-weight:600;font-size:.92rem;}
  .srcName small{display:block;font-weight:400;color:var(--muted);font-size:.76rem;margin-top:.1rem;}
  .srcRow.sig .srcName{color:var(--claimed);}
  .feeds{display:flex;flex-wrap:wrap;gap:.3rem;}
  .feed{font-family:var(--mono);font-size:.68rem;color:var(--muted);background:var(--sunk);
    border:1px solid var(--rule);border-radius:4px;padding:.1rem .4rem;}
  .srcRow.sig .feed{background:var(--paper);border-color:transparent;color:var(--claimed);}

  .vs{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper);}
  .vsRow{display:grid;grid-template-columns:minmax(0,1.5fr) 7.5rem 7.5rem;
    border-top:1px solid var(--rule);align-items:center;}
  .vsRow:first-child{border-top:0;background:var(--sunk);}
  .vsRow > *{padding:.7rem 1rem;}
  .vsRow .c{text-align:center;font-weight:600;font-size:.9rem;border-left:1px solid var(--rule);}
  .vsRow.head .c{font-size:.82rem;}
  .yes{color:var(--proven);}
  .no{color:var(--muted);}
  .vsQ{font-size:.93rem;}

  .pull{font-family:var(--display);font-size:clamp(1.25rem,2.5vw,1.6rem);line-height:1.32;
    border-left:3px solid var(--accent);padding-left:1rem;margin:0;max-width:32rem;}
  .aboutGrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.8rem;align-items:start;}
  .facts{list-style:none;margin:0;padding:0;}
  .facts li{padding:.5rem 0;border-top:1px solid var(--rule);color:var(--muted);font-size:.93rem;}
  .facts li:first-child{border-top:0;}
  .facts b{color:var(--ink);font-weight:600;}
  /* the link through to /about needs a thumb-sized target, not just its 16px text box */
  .moreLink{display:inline-flex;align-items:center;min-height:40px;font-weight:500;}
  .close{text-align:center;}
  .close .lede{margin-inline:auto;}
  .close .heroActs{justify-content:center;}

  footer{border-top:1px solid var(--rule);padding-block:1.5rem 2.4rem;color:var(--muted);font-size:.85rem;}
  .footin{display:flex;flex-wrap:wrap;gap:.3rem 1.4rem;align-items:center;}
  .footin .sp{margin-left:auto;}
  .footin a{display:inline-flex;align-items:center;min-height:40px;}

  :where(a,button,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  @media (max-width:900px){
    .heroGrid{grid-template-columns:1fr;gap:1.8rem;}
    .lede,.note{max-width:none;}
    .nav{display:none;}
    .flow{grid-template-columns:1fr;}
    .fcell + .fcell{border-left:0;border-top:1px solid var(--rule);}
    .aboutGrid{grid-template-columns:1fr;gap:1.3rem;}
    .strip{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:620px){
    html{font-size:14.5px}
    .logo{height:40px;}
    .topin{gap:.6rem;padding-inline:1rem;}
    .wrap{padding-inline:1rem;}
    .cols{grid-template-columns:1fr;}
    .col + .col{border-left:0;border-top:1px solid var(--rule);}
    .srcRow{grid-template-columns:1fr;gap:.45rem;}
    .vsRow{grid-template-columns:minmax(0,1fr) 4.4rem 4.4rem;}
    .vsRow > *{padding:.6rem .7rem;}
    .strip{grid-template-columns:1fr;gap:.85rem;}
    /* wrap the ledger tabs rather than hiding the third behind a scrollbar-less swipe */
    .ledgerTabs{flex-wrap:wrap;overflow-x:visible;}
    .ltab{flex:1 1 auto;font-size:.76rem;padding-inline:.6rem;}
    .footin .sp{margin-left:0;}
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important} }
</style>
</head>
<body>

<header class="top"><div class="topin" id="topbar"></div></header>

<script>

/* ═══ MECHANICS — domain-free. ═══ */
(function(){
  const el = (id) => document.getElementById(id);
  const h  = (s) => (s == null ? "" : String(s));
  const B  = SITE.brand;

  el("brandmark").innerHTML =
    `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <nav class="nav">${(B.nav||[]).map(n=>`<a href="${h(n.href)}">${h(n.label)}</a>`).join("")}</nav>
    <span class="topcta" id="topcta"><a class="btn" href="${h(B.appHref)}">${h(B.appLabel)}</a></span>`;

  const ledgerCols = (c) => `
    <div class="cols">
      ${["proven","claimed"].map(k => `
        <div class="col ${k}">
          <div class="colHead">${h(c[k].head)} <em>${h(c[k].sub)}</em></div>
          ${c[k].rows.map(r => `<div class="row">${h(r.t)}<br><span class="cite">${h(r.c)}</span></div>`).join("")}
        </div>`).join("")}
    </div>
    <div class="ledgerGap"><b>${h(SITE.ledger.gapLabel)}</b> ${h(c.gap)}</div>`;

  const heroHtml = () => {
    const H = SITE.hero, L = SITE.ledger;
    return `<section class="hero"><div class="wrap"><div class="heroGrid">
      <div>
        <h1>${h(H.title).replace(/\n/g,"<br>")}</h1>
        <p class="lede">${h(H.lede)}</p>
        <div class="heroActs">
          <a class="btn" href="${h(B.appHref)}">${h(B.askLabel)}</a>
          ${H.secondary ? `<a class="btn quiet" href="${h(H.secondary.href)}">${h(H.secondary.label)}</a>` : ""}
        </div>
      </div>
      <div class="ledger" id="ledger">
        <div class="ledgerTabs" role="tablist" aria-label="Example questions">
          ${L.cases.map((c,i)=>`<button class="ltab" role="tab" aria-selected="${i===0}" data-i="${i}">${h(c.tab)}</button>`).join("")}
        </div>
        <div>
          <div class="ledgerQ">${h(L.cases[0].q)}</div>
          <div id="ledgerCols">${ledgerCols(L.cases[0])}</div>
        </div>
      </div>
    </div></div></section>`;
  };

  const abilitiesHtml = () => { const A = SITE.abilities; if(!A) return "";
    return `<section><div class="wrap"><h2>${h(A.title)}</h2>
      <div class="strip">${A.items.map(i=>`<div><b>${h(i.b)}</b><span>${h(i.s)}</span></div>`).join("")}</div>
    </div></section>`; };

  const flowHtml = () => { const F = SITE.flow; if(!F) return "";
    return `<section><div class="wrap"><h2>${h(F.title)}</h2>
      <div class="flow">${F.steps.map(s=>`<div class="fcell"><h3>${h(s.h)}</h3><p>${h(s.p)}</p></div>`).join("")}</div>
    </div></section>`; };

  const sourcesHtml = () => { const S = SITE.sources; if(!S) return "";
    return `<section id="sources"><div class="wrap"><h2>${h(S.title)}</h2>
      <div class="srcTable">${S.rows.map(r=>`
        <div class="srcRow${r.signal?" sig":""}">
          <div class="srcName">${h(r.name)}<small>${h(r.sub)}</small></div>
          <div class="feeds">${r.feeds.map(f=>`<span class="feed">${h(f)}</span>`).join("")}</div>
        </div>`).join("")}</div>
      ${S.note?`<p class="note" style="margin-top:1rem">${h(S.note)}</p>`:""}
    </div></section>`; };

  const compareHtml = () => { const C = SITE.compare; if(!C) return "";
    const mark = (v) => v ? `<span class="yes">Yes</span>` : `<span class="no">No</span>`;
    return `<section><div class="wrap"><h2>${h(C.title)}</h2>
      <div class="vs">
        <div class="vsRow head"><div class="vsQ"></div><div class="c">${h(C.us)}</div><div class="c">${h(C.them)}</div></div>
        ${C.rows.map(r=>`<div class="vsRow"><div class="vsQ">${h(r.q)}</div>
          <div class="c">${mark(r.us)}</div><div class="c">${mark(r.them)}</div></div>`).join("")}
      </div>
    </div></section>`; };

  const aboutHtml = () => { const A = SITE.about; if(!A) return "";
    return `<section id="about"><div class="wrap"><h2>${h(A.title)}</h2>
      <div class="aboutGrid">
        <p class="pull">${h(A.pull)}</p>
        <div><ul class="facts">${A.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
        ${A.more?`<p style="margin:.5rem 0 0"><a class="moreLink" href="${h(A.more.href)}">${h(A.more.label)}</a></p>`:""}</div>
      </div></div></section>`; };

  const closeHtml = () => { const C = SITE.close; if(!C) return "";
    return `<section class="close"><div class="wrap">
      <h2>${h(C.title)}</h2><p class="lede">${h(C.lede)}</p>
      <div class="heroActs"><a class="btn" href="${h(B.appHref)}">${h(B.appLabel)}</a></div>
    </div></section>`; };

  el("main").innerHTML = heroHtml() + abilitiesHtml() + flowHtml() + sourcesHtml()
                       + compareHtml() + aboutHtml() + closeHtml();

  el("foot").innerHTML = `
    <span>&copy; <span id="yr"></span> ${h(B.name)}</span>
    <span class="sp"><a href="${h(B.appHref)}">Platform</a></span>
    <span><a href="/about">About</a></span>
    ${B.contact?`<span><a href="mailto:${h(B.contact)}">Contact</a></span>`:""}`;
  el("yr").textContent = new Date().getFullYear();

  const tabs = [...document.querySelectorAll(".ltab")];
  const showCase = (i) => {
    const c = SITE.ledger.cases[i];
    document.querySelector(".ledgerQ").textContent = c.q;
    el("ledgerCols").innerHTML = ledgerCols(c);
    tabs.forEach((t,n) => t.setAttribute("aria-selected", String(n === i)));
  };
  tabs.forEach(t => {
    t.addEventListener("click", () => showCase(Number(t.dataset.i)));
    t.addEventListener("keydown", (e) => {
      const i = Number(t.dataset.i);
      if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
        e.preventDefault();
        const n = (i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
        tabs[n].focus(); showCase(n);
      }
    });
  });

  const sentinel = document.querySelector(".hero");
  const topcta = el("topcta");
  if(sentinel && "IntersectionObserver" in window){
    new IntersectionObserver(([e]) => topcta.classList.toggle("on", !e.isIntersecting),
      {rootMargin: "-70px 0px 0px 0px"}).observe(sentinel);
  } else { topcta.classList.add("on"); }
})();
</script>
</body>
</html>
