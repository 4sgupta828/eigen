<style>
  :root{
    color-scheme:light;
    --bg:#EDF2F7; --panel:#FFFFFF; --panel2:#F4F8FC; --ink:#111F2B; --muted:#57687A;
    --accent:#1568B5; --accent-strong:#0F5497; --accent-rgb:21,104,181;
    --verified:#137A54; --gap:#B26A1E; --on-accent:#FFFFFF;
    --hair:#D3DFEB; --hair-soft:rgba(17,31,43,.06);
    --display:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
    --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#050D19; --panel:#0E1928; --panel2:#0B1421; --ink:#ECEBE3; --muted:#8B96A9;
    --accent:#D3B37C; --accent-strong:#E7CB93; --accent-rgb:211,179,124;
    --verified:#57B891; --gap:#D6975A; --on-accent:#17100A;
    --hair:#22304A; --hair-soft:rgba(255,255,255,.06);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;font-size:15px;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.62;font-size:1rem;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(115% 55% at 88% -12%, rgba(var(--accent-rgb),.075), transparent 62%);
    background-attachment:fixed;}
  .wrap{max-width:58rem;margin:0 auto;padding-inline:1.15rem;}
  a{color:var(--accent-strong);text-underline-offset:3px;}

  h1,h2,.fname{font-family:var(--display);font-variation-settings:"opsz" 60;
    font-weight:500;letter-spacing:-.016em;line-height:1.14;margin:0 0 .9rem;}
  h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.08;letter-spacing:-.018em;font-weight:500;}
  h2{font-size:clamp(1.62rem,3.7vw,2.32rem);font-weight:500;}
  h3{font-size:1.04rem;font-weight:600;margin:0 0 .35rem;letter-spacing:-.004em;}

  .eyebrow{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.17em;
    color:var(--accent);margin:0 0 .85rem;}
  .lede{font-size:clamp(1.06rem,2.1vw,1.25rem);color:var(--muted);max-width:38rem;margin:0 0 1.8rem;}
  .sub{color:var(--muted);max-width:40rem;margin:0 0 2.1rem;}
  section{padding-block:clamp(2.9rem,6vw,4.8rem);}
  section + section{border-top:1px solid var(--hair);}

  /* masthead */
  header.top{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);}
  .topin{max-width:58rem;margin:0 auto;padding:.5rem 1.15rem;display:flex;align-items:center;gap:.8rem;}
  .logo{height:52px;width:auto;flex:none;}
  .navlinks{display:flex;gap:1.15rem;margin-left:1rem;}
  .navlinks a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:450;
    display:inline-flex;align-items:center;min-height:40px;}
  .navlinks a:hover{color:var(--ink);}
  .cta{display:inline-flex;align-items:center;min-height:42px;padding:.5rem 1.05rem;
    border-radius:9px;background:var(--accent);color:var(--on-accent);text-decoration:none;
    font-weight:600;font-size:.92rem;border:1px solid var(--accent-strong);
    transition:background .15s ease,transform .12s ease;}
  .cta:hover{background:var(--accent-strong);}
  .cta:active{transform:translateY(1px);}
  .topin .cta{margin-left:auto;}
  .themebtn{min-height:38px;min-width:38px;padding:.3rem .62rem;border-radius:8px;cursor:pointer;
    background:transparent;border:1px solid var(--hair);color:var(--muted);
    font-family:var(--mono);font-size:.7rem;}
  .ghost{display:inline-flex;align-items:center;min-height:42px;padding:.5rem 1.05rem;border-radius:9px;
    border:1px solid var(--hair);background:var(--panel);color:var(--ink);
    text-decoration:none;font-weight:600;font-size:.92rem;}
  .ghost:hover{border-color:var(--accent);}

  /* hero */
  .hero{padding-block:clamp(3.2rem,8vw,5.8rem) clamp(2.6rem,6vw,4.2rem);}
  .ctas{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;}
  .heroNote{font-family:var(--mono);font-size:.73rem;color:var(--muted);margin-top:1.2rem;}

  /* sample question → answer, the one product glimpse on the page */
  .sample{margin-top:2.6rem;background:var(--panel);border:1px solid var(--hair);border-radius:14px;
    overflow:hidden;box-shadow:0 1px 2px var(--hair-soft);}
  .sq{padding:.95rem 1.05rem;border-bottom:1px solid var(--hair);background:var(--panel2);
    display:flex;gap:.6rem;align-items:flex-start;}
  .sqMark{font-family:var(--mono);font-size:.7rem;color:var(--accent);flex:none;padding-top:.16rem;}
  .sqText{font-family:var(--display);font-variation-settings:"opsz" 30;
    font-size:1.06rem;color:var(--ink);}
  .sa{padding:1rem 1.05rem;}
  .sa p{margin:0 0 .7rem;font-size:.97rem;}
  .src{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.68rem;
    color:var(--accent);background:rgba(var(--accent-rgb),.08);border-radius:999px;
    padding:.12rem .5rem;white-space:nowrap;}
  .srcs{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.15rem;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--verified);flex:none;}

  /* grids */
  .grid{display:grid;gap:1rem;}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;
    padding:1.15rem 1.1rem;box-shadow:0 1px 2px var(--hair-soft);}
  .card p{margin:0;color:var(--muted);font-size:.93rem;}

  /* what we read — source families, each listing the real feeds behind it */
  .srcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem;}
  .srcgroup{background:var(--panel);border:1px solid var(--hair);border-radius:12px;
    padding:.95rem .9rem;box-shadow:0 1px 2px var(--hair-soft);}
  .sgTitle{display:flex;align-items:center;gap:.45rem;margin-bottom:.6rem;
    font-size:.92rem;font-weight:600;letter-spacing:-.004em;}
  .sgTitle .bar{width:3px;height:15px;border-radius:2px;background:var(--accent);flex:none;}
  .srcgroup.signal .sgTitle .bar{background:var(--gap);}
  .sgItems{display:flex;flex-wrap:wrap;gap:.3rem;}
  .sgItem{font-family:var(--mono);font-size:.67rem;color:var(--muted);border:1px solid var(--hair);
    border-radius:6px;padding:.15rem .42rem;background:var(--panel2);}
  .sgNote{margin-top:.6rem;font-size:.79rem;color:var(--gap);line-height:1.45;}
  .srcFoot{margin-top:1.15rem;font-size:.9rem;color:var(--muted);}

  /* numbered steps */
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4rem;}
  .stepN{font-family:var(--display);font-variation-settings:"opsz" 72;
    font-size:2.3rem;line-height:1;color:var(--accent);opacity:.55;margin-bottom:.45rem;}
  .step p{margin:0;color:var(--muted);font-size:.93rem;}

  /* trust — one line each, no essays */
  .trust{display:grid;gap:.05rem;}
  .trow{display:flex;gap:.85rem;align-items:flex-start;padding:.95rem 0;border-bottom:1px solid var(--hair);}
  .trow:last-child{border-bottom:0;}
  .tickmark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    background:rgba(var(--accent-rgb),.11);color:var(--accent);font-size:.72rem;margin-top:.1rem;}
  .trow b{font-weight:600;}
  .trow span{color:var(--muted);}

  /* audiences */
  .aud{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:1.3rem 1.25rem;}
  .audHead{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;
    padding-bottom:.7rem;border-bottom:1px solid var(--hair);flex-wrap:wrap;}
  .audHead h3{margin:0;font-family:var(--display);font-variation-settings:"opsz" 40;
    font-size:1.28rem;font-weight:550;}
  .pill{font-family:var(--mono);font-size:.61rem;text-transform:uppercase;letter-spacing:.13em;
    color:var(--accent);border:1px solid var(--hair);border-radius:999px;padding:.16rem .55rem;
    background:rgba(var(--accent-rgb),.06);}
  ul.ticks{list-style:none;margin:0;padding:0;}
  ul.ticks li{position:relative;padding-left:1.45rem;margin-bottom:.68rem;font-size:.94rem;color:var(--muted);}
  ul.ticks li:last-child{margin-bottom:0;}
  ul.ticks li::before{content:"";position:absolute;left:.25rem;top:.62em;width:7px;height:7px;
    border-radius:50%;background:var(--verified);}
  ul.ticks li b{color:var(--ink);font-weight:600;}

  /* about */
  .about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem;align-items:start;}
  .fcard{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:1.3rem 1.2rem;}
  .fname{font-size:1.4rem;margin:0 0 .15rem;}
  .frole{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;
    color:var(--accent);margin:0 0 .9rem;}
  .fbio{margin:0 0 .9rem;color:var(--muted);font-size:.94rem;}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;}
  .chip{font-family:var(--mono);font-size:.68rem;color:var(--muted);border:1px solid var(--hair);
    border-radius:6px;padding:.16rem .45rem;background:var(--panel2);}

  .closing{text-align:center;}
  .closing .lede{margin-inline:auto;}
  .closing .ctas{justify-content:center;}

  footer{border-top:1px solid var(--hair);padding-block:1.6rem 2.4rem;color:var(--muted);font-size:.86rem;}
  .footin{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:center;}
  .footin .sp{margin-left:auto;}
  .footin a{display:inline-flex;align-items:center;min-height:40px;}

  @media (max-width:860px){
    .about{grid-template-columns:1fr;}
    .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
    .srcgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .steps{grid-template-columns:1fr;gap:1.15rem;}
    .navlinks{display:none;}
  }
  @media (max-width:560px){
    html{font-size:14.5px}
    .g2,.g4{grid-template-columns:1fr;}
    .srcgrid{grid-template-columns:1fr;}
    .logo{height:42px;}
    .topin{gap:.5rem;padding-inline:1rem;}
    .cta{padding:.5rem .78rem;font-size:.85rem;}
    .themebtn{display:none;}
    .wrap{padding-inline:1rem;}
    .footin .sp{margin-left:0;}
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important} }
</style>
</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════════════════

   MECHANICS — domain-free rendering. Nothing below names a product.

  el("topbar").innerHTML = `
    <a href="/" aria-label="${h(SITE.brand.name)} home" style="display:flex;text-decoration:none;">${logo}</a>

  const layouts = {

    sources: (items) => `<div class="srcgrid">${items.map(i => `

    steps: (items) => `<div class="steps">${items.map((i, n) => `

  };

  const sampleHtml = () => {

    return `<div class="sample">
      <div class="sq"><span class="sqMark">ASK</span><span class="sqText">${h(S.q)}</span></div>
      <div class="sa">${(S.a || []).map(p => `<p>${h(p)}</p>`).join("")}
        <div class="srcs">${(S.sources || []).map(s =>
          `<span class="src"><span class="dot"></span>${h(s)}</span>`).join("")}</div>
      </div></div>`;
  };

  const heroHtml = () => {
    const H = SITE.hero; if(!H) return "";
    return `<section class="hero"><div class="wrap">
      ${H.eyebrow ? `<p class="eyebrow">${h(H.eyebrow)}</p>` : ""}
      <h1>${h(H.title).replace(/\n/g, "<br>")}</h1>
      ${H.lede ? `<p class="lede">${h(H.lede)}</p>` : ""}
      <div class="ctas">${cta("cta")}${H.secondary ? `<a class="ghost" href="${h(H.secondary.href)}">${h(H.secondary.label)}</a>` : ""}</div>
      ${H.note ? `<p class="heroNote">${h(H.note)}</p>` : ""}
      ${sampleHtml()}
    </div></section>`;
  };

  const sectionHtml = (s) => `<section id="${h(s.id)}"><div class="wrap">
      ${s.eyebrow ? `<p class="eyebrow">${h(s.eyebrow)}</p>` : ""}
      ${s.title ? `<h2>${h(s.title)}</h2>` : ""}
      ${s.sub ? `<p class="sub">${h(s.sub)}</p>` : ""}
      ${layouts[s.layout] ? layouts[s.layout](s.items || []) : ""}
      ${s.foot ? `<p class="srcFoot">${h(s.foot)}</p>` : ""}</div></section>`;

  const aboutHtml = () => {
    const A = SITE.about; if(!A) return "";
    const F = A.founder;
    return `<section id="about"><div class="wrap">
      ${A.eyebrow ? `<p class="eyebrow">${h(A.eyebrow)}</p>` : ""}
      ${A.title ? `<h2>${h(A.title)}</h2>` : ""}
      <div class="about">
        <div>${(A.blurb || []).map(p => `<p class="sub" style="margin-bottom:1rem">${h(p)}</p>`).join("")}</div>
        ${F ? `<div class="fcard">
          <p class="fname">${h(F.name)}</p>
          <p class="frole">${h(F.role)}</p>
          <p class="fbio">${h(F.bio)}</p>
          <div class="chips">${(F.chips || []).map(c => `<span class="chip">${h(c)}</span>`).join("")}</div>
        </div>` : ""}
      </div></div></section>`;
  };

  const closingHtml = () => {
    const C = SITE.closing; if(!C) return "";
    return `<section class="closing"><div class="wrap">
      ${C.eyebrow ? `<p class="eyebrow">${h(C.eyebrow)}</p>` : ""}
      ${C.title ? `<h2>${h(C.title)}</h2>` : ""}
      ${C.lede ? `<p class="lede">${h(C.lede)}</p>` : ""}
      <div class="ctas">${cta("cta")}</div></div></section>`;
  };

  el("main").innerHTML =
    heroHtml() + (SITE.sections || []).map(sectionHtml).join("") + aboutHtml() + closingHtml();

  el("foot").innerHTML = `
    <span>© <span id="yr"></span> ${h(SITE.brand.name)}</span>
    <span class="sp"><a href="${h(SITE.brand.appHref)}">Platform</a></span>
    <span><a href="#about">About</a></span>
    ${SITE.brand.contact ? `<span><a href="mailto:${h(SITE.brand.contact)}">Contact</a></span>` : ""}`;
  el("yr").textContent = new Date().getFullYear();

  const KEY = "eigen-theme", btn = el("themebtn");
  const apply = (t) => {
    if(t === "dark"){ document.documentElement.setAttribute("data-theme", "dark"); btn.textContent = "☾ Dark"; }
    else { document.documentElement.removeAttribute("data-theme"); btn.textContent = "☀ Light"; }
  };
  let saved = null; try{ saved = localStorage.getItem(KEY); }catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  btn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next); try{ localStorage.setItem(KEY, next); }catch(e){}
  });
})();
</script>
</body>
</html>
